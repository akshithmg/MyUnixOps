---
- name: Patch Linux VM
  hosts: all
  become: yes

  tasks:

    - name: Update packages (Ubuntu)
      apt:
        update_cache: yes
        upgrade: dist
      when: ansible_os_family == "Debian"

    - name: Update packages (RHEL)
      dnf:
        name: "*"
        state: latest
      when: ansible_os_family == "RedHat"

    - name: Reboot if required
      reboot:
        reboot_timeout: 900

    - name: Wait for SSH
      wait_for_connection:
        timeout: 300

    - name: Verify service
      service_facts:

    - debug:
        msg: "Patching completed successfully."
